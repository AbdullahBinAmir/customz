          fpd = new FancyProductDesigner(
            document.getElementById("fpd-target"),
            appOptionsEmbroidery
          )
        } else {
          designType = "Printing"
          fpd = new FancyProductDesigner(
            document.getElementById("fpd-target"),
            appOptions
          )
        }

        fpd.addEventListener("ready", () => {
          const triggerButton = document.getElementById("triggerButton")
          const exit = document.getElementById("exitButton")
          // const triggerSelect = document.getElementById("select")

          // let designType = "printing"
          const modulesToHide = ["images", "designs"]

          const hideSubmodules = (designType) => {
            // Select all the module elements
            const modules = document.querySelectorAll(
              "fpd-module-images, fpd-module-designs"
              // fpd-module-text, fpd-module-designs"
            )
            const textModule = document.querySelector("fpd-module-text")

            console.log("modules", modules)
            modules.forEach((module) => {
              if (designType === "embroidery") {
                // Hide the submodules
                // module.style.display = "none" // Hides the entire module
                module.classList.remove("fpd-active")
              } else {
                module.classList.add("fpd-active")
                // module.style.display = "block" // Reset to default display
                // Show the module if not hiding
              }
            })
          }

          const updateModuleVisibility = () => {
            const mainBar = fpd.mainBar.container // Access the main bar container
            console.log("main bar", mainBar)
            modulesToHide.forEach((moduleKey) => {
              // Find the specific main module's DOM element by its data attribute
              const moduleElement = mainBar.querySelector(
                `[data-module="${moduleKey}"]`
              )

              if (moduleElement) {
                // Find all submodules associated with the main module
                const subModuleElements = mainBar.querySelectorAll(
                  `[data-submodule-of="${moduleKey}"]`
                )

                if (designType === "embroidery") {
                  // Hide main module for embroidery design type
                  moduleElement.style.display = "none" // Hide the main module
                  console.log(`Hid main module: ${moduleKey}`)

                  // Hide all submodules associated with the main module
                  subModuleElements.forEach((subModuleElement) => {
                    subModuleElement.style.display = "none" // Hide the submodule
                    console.log(
                      `Hid submodule: ${subModuleElement.getAttribute(
                        "data-submodule-of"
                      )}`
                    )
                  })
                } else {
                  // Show main module for other design types
                  moduleElement.style.display = "block" // Show the main module
                  console.log(`Showed main module: ${moduleKey}`)

                  // Show all submodules associated with the main module
                  subModuleElements.forEach((subModuleElement) => {
                    subModuleElement.style.display = "block" // Show the submodule
                    console.log(
                      `Showed submodule: ${subModuleElement.getAttribute(
                        "data-submodule-of"
                      )}`
                    )
                  })
                }
              } else {
                console.log(`Main module not found: ${moduleKey}`)
              }
            })
          }

          // Update visibility on design type change
          // triggerSelect.addEventListener("change", (event) => {
          //   designType = event.target.value
          //   // hideSubmodules(designType)
          //   // updateModuleVisibility()
          // })

          // Initial visibility setup
          // hideSubmodules(designType)
          // updateModuleVisibility()

          // const extraData = {
          //   message: "Hello from iframe!",
          //   otherProperty: "Some value",
          // }
          triggerButton.addEventListener("click", () => {
            fpd.getProductDataURL(function (dataURL) {
              const messagePayload = {
                dataURL,
                isBase64: true,
                designType,
              }
              window.parent.postMessage(messagePayload, "*")
            })
          })

          exit.addEventListener("click", () => history.back())
        })
      </script>
    </div>
  </body>
</html>
